[package]
name = "pyvoy"
version = "0.0.0"
edition = "2024"
repository = "https://github.com/curioswitch/pyvoy"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]
name = "pyvoy"
path = "src/lib.rs"

[dependencies]
# Serves static mounts. Must use the same SDK revision as above.
envoy-files-filter = { git = "https://github.com/curioswitch/envoy-files", tag = "v0.3.0" }
envoy-proxy-dynamic-modules-rust-sdk = { git = "https://github.com/envoyproxy/envoy", tag = "v1.40.0" }
url = "2.5.8"

bytes = "1.12.1"
crossbeam-channel = "0.5.17"
encoding_rs = "0.8.42"
http = "1.5.0"
itoa = "1.0.18"
pyo3 = { version = "0.30.1", features = ["bytes"] }
tungstenite = "0.30.0"
urlencoding = "2.1.3"
yaml-rust2 = "0.13.0"

[build-dependencies]
pyo3-build-config = { version = "0.30.1", features = ["resolve-config"] }

[patch.crates-io]
# Fork of tungstenite with permessage-deflate (RFC 7692) support, enabled by
# default. See https://github.com/curioswitch/tungstenite-rs.
tungstenite = { git = "https://github.com/curioswitch/tungstenite-rs", branch = "v0.30.0-deflate" }
